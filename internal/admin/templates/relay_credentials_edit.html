<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LynAI Admin · {{.Title}}</title>{{template "layout-css"}}</head><body>{{template "admin-sidebar" .}}<div class="main"><h1 style="margin-bottom:24px;">{{.Provider.Name}} · {{.Title}}</h1>{{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}<div class="card"><form method="POST" action="{{.Action}}"><input type="hidden" name="_csrf" value="{{.CSRFToken}}">
<div class="form-group"><label>名称</label><input name="name" value="{{.Name}}" required></div><div class="form-group"><label>API Key {{if .Editing}}<span class="muted">（留空表示不修改，现有值不会显示）</span>{{end}}</label><input type="password" name="apiKey" autocomplete="new-password"></div><div class="form-group"><label>优先级</label><input type="number" name="priority" value="{{.Priority}}" required></div>
<h3 style="margin:20px 0 12px;">ProviderConfig 覆盖 <span class="muted">（留空继承上游默认值）</span></h3><div style="display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px;"><div class="form-group"><label>AppID</label><input name="appId" value="{{.AppID}}"></div><div class="form-group"><label>Client Version</label><input name="clientVersion" value="{{.ClientVersion}}"></div><div class="form-group"><label>Package</label><input name="package" value="{{.Package}}"></div><div class="form-group"><label>OCR Pos</label><input name="ocrPos" value="{{.OCRPos}}"></div><div class="form-group"><label>Business ID 前缀</label><input name="businessIdPrefix" value="{{.BusinessIDPrefix}}"></div><div class="form-group"><label>Image Module</label><input name="imageModule" value="{{.ImageModule}}"></div></div><div class="form-group"><label><input type="checkbox" name="enabled" {{if .Enabled}}checked{{end}} style="width:auto;"> 启用</label></div><button class="btn btn-primary">保存</button> <a class="btn btn-secondary" href="/admin/relay/{{.Provider.ID}}/credentials">取消</a></form></div></div></body></html>
