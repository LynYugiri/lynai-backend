<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LynAI Admin · 全局模型</title>{{template "layout-css"}}</head><body>{{template "admin-sidebar" .}}<div class="main"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;"><h1>全局模型</h1><a class="btn btn-primary" href="/admin/relay/models/new">新增模型</a></div>{{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}<div class="card"><table><thead><tr><th>模型 ID</th><th>名称</th><th>分类</th><th>绑定</th><th>状态</th><th>操作</th></tr></thead><tbody>{{range .Models}}{{$m := .Model}}<tr><td>{{$m.ModelID}}</td><td>{{$m.DisplayName}}</td><td>{{$m.Category}}</td><td>{{.BindingCount}}</td><td>{{if $m.Enabled}}<span class="badge badge-approved">启用</span>{{else}}<span class="badge badge-rejected">停用</span>{{end}}</td><td class="actions"><a class="btn btn-sm btn-secondary" href="/admin/relay/models/{{$m.ID}}/edit">编辑</a><form method="POST" action="/admin/relay/models/{{$m.ID}}/toggle"><input type="hidden" name="_csrf" value="{{$.CSRFToken}}"><button class="btn btn-sm btn-secondary">{{if $m.Enabled}}停用{{else}}启用{{end}}</button></form><form method="POST" action="/admin/relay/models/{{$m.ID}}/delete"><input type="hidden" name="_csrf" value="{{$.CSRFToken}}"><button class="btn btn-sm btn-danger">删除</button></form></td></tr>{{else}}<tr><td colspan="6" class="empty">暂无模型</td></tr>{{end}}</tbody></table></div></div></body></html>
