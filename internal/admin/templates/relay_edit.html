<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LynAI Admin · {{.Title}}</title>{{template "layout-css"}}</head>
<body>{{template "admin-sidebar" .}}<div class="main">
<h1 style="margin-bottom:24px;">{{.Title}}</h1>{{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}
<div class="card"><form method="POST" action="{{.Action}}"><input type="hidden" name="_csrf" value="{{.CSRFToken}}">
<div class="form-group"><label>名称</label><input name="name" value="{{.Name}}" required></div>
<div class="form-group"><label>Endpoint</label><input type="url" name="endpoint" value="{{.Endpoint}}" placeholder="https://api.openai.com/v1" required></div>
<div class="form-group"><label>API Type</label><select name="apiFormat">
<option value="openai" {{if eq .APIFormat "openai"}}selected{{end}}>openai</option><option value="anthropic" {{if eq .APIFormat "anthropic"}}selected{{end}}>anthropic</option><option value="ollama" {{if eq .APIFormat "ollama"}}selected{{end}}>ollama</option><option value="openai_image" {{if eq .APIFormat "openai_image"}}selected{{end}}>openai_image</option><option value="vivo_image" {{if eq .APIFormat "vivo_image"}}selected{{end}}>vivo_image</option><option value="openai_speech" {{if eq .APIFormat "openai_speech"}}selected{{end}}>openai_speech</option><option value="vivo_lasr" {{if eq .APIFormat "vivo_lasr"}}selected{{end}}>vivo_lasr</option><option value="vivo_ocr" {{if eq .APIFormat "vivo_ocr"}}selected{{end}}>vivo_ocr</option>
</select></div>
<h3 style="margin:20px 0 12px;">默认 ProviderConfig</h3>
<div style="display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px;"><div class="form-group"><label>AppID</label><input name="appId" value="{{.AppID}}"></div><div class="form-group"><label>Client Version</label><input name="clientVersion" value="{{.ClientVersion}}"></div><div class="form-group"><label>Package</label><input name="package" value="{{.Package}}"></div><div class="form-group"><label>OCR Pos</label><input name="ocrPos" value="{{.OCRPos}}"></div><div class="form-group"><label>Business ID 前缀</label><input name="businessIdPrefix" value="{{.BusinessIDPrefix}}"></div><div class="form-group"><label>Image Module</label><input name="imageModule" value="{{.ImageModule}}"></div></div>
<div class="form-group"><label><input type="checkbox" name="enabled" {{if .Enabled}}checked{{end}} style="width:auto;"> 启用</label></div>
<button class="btn btn-primary" type="submit">保存</button> <a class="btn btn-secondary" href="/admin/relay">取消</a>
</form></div></div></body></html>
