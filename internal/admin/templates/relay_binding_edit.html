<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LynAI Admin · 编辑绑定</title>{{template "layout-css"}}</head><body>{{template "admin-sidebar" .}}<div class="main"><h1 style="margin-bottom:24px;">{{.Model.ModelID}} · 编辑绑定</h1>{{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}<div class="card"><form method="POST" action="/admin/relay/bindings/{{.Binding.ID}}/edit"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><div class="form-group"><label>上游</label><select name="providerId">{{range .Providers}}<option value="{{.ID}}" {{if eq .ID $.Binding.ProviderID}}selected{{end}}>{{.Name}} ({{.APIFormat}})</option>{{end}}</select></div><div class="form-group"><label>上游模型</label><input name="upstreamModel" value="{{.Binding.UpstreamModel}}" required></div><div class="form-group"><label>权重</label><input type="number" min="1" name="weight" value="{{.Binding.Weight}}" required></div><div class="form-group"><label><input type="checkbox" name="enabled" {{if .Binding.Enabled}}checked{{end}} style="width:auto;"> 启用</label></div><button class="btn btn-primary">保存</button> <a class="btn btn-secondary" href="/admin/relay/models/{{.Model.ID}}/edit">取消</a></form></div></div></body></html>
